version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-threatiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI app (uvicorn) ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-threatiq}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-threatiq_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-threatiq}
      - REDIS_HOST=redis
      - MISP_URL=${MISP_URL:-}
      - MISP_API_KEY=${MISP_API_KEY:-}
      - CIRCL_USERNAME=${CIRCL_USERNAME:-}
      - CIRCL_PASSWORD=${CIRCL_PASSWORD:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - OTX_API_URL=${OTX_API_URL:-https://otx.alienvault.com/api/v1}
      - OPENCTI_URL=${OPENCTI_URL:-}
      - OPENCTI_TOKEN=${OPENCTI_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./model_artifacts:/app/model_artifacts
      - ./data:/app/data

  # ── Celery worker (background tasks: ingestion, training) ──────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-threatiq}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-threatiq_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-threatiq}
      - REDIS_HOST=redis
      - MISP_URL=${MISP_URL:-}
      - MISP_API_KEY=${MISP_API_KEY:-}
      - CIRCL_USERNAME=${CIRCL_USERNAME:-}
      - CIRCL_PASSWORD=${CIRCL_PASSWORD:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - OTX_API_URL=${OTX_API_URL:-https://otx.alienvault.com/api/v1}
      - OPENCTI_URL=${OPENCTI_URL:-}
      - OPENCTI_TOKEN=${OPENCTI_TOKEN:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./model_artifacts:/app/model_artifacts
      - ./data:/app/data

  # ── Celery Beat (scheduled feed ingestion) ────────────────────
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis

volumes:
  postgres_data:
